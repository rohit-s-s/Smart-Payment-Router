name: Build Smart Payment Router Flutter APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test --coverage

      - name: Build Android Debug APK
        run: |
          flutter build apk --debug 2>&1 | tee build.log
          BUILD_CODE=${PIPESTATUS[0]}
          if [ $BUILD_CODE -ne 0 ]; then
            echo "=== BUILD ERROR TAIL LOG ==="
            tail -n 120 build.log
            ERRORS=$(grep -i -C 2 -E "(e: |error: |FAILURE:|Task.*FAILED)" build.log | tail -n 25 | tr '\n' ' ')
            echo "::error title=Flutter Build Error::$ERRORS"
            exit $BUILD_CODE
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-payment-router-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: "Smart Payment Router ${{ github.ref_name }}"
          body: |
            ### Smart Payment Router Cross-Platform Flutter Release
            - Cross-platform Flutter + Material 3 implementation
            - Epic 1: Real-time UPI QR Scanner, MCC-based Category Detection & Dynamic Card Reward Routing
            - Epic 2: Add/Edit/Delete Cards & Offers, Exclusions & 90-Day Rule Review
            - Download `app-debug.apk` below and install directly on your Android device!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
