name: Build Smart Payment Router Android APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: |
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Android Debug APK
        run: |
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log
          BUILD_CODE=${PIPESTATUS[0]}
          if [ $BUILD_CODE -ne 0 ]; then
            ERRORS=$(grep -i -C 2 -E "(e: |error: |FAILURE:|Task.*FAILED)" gradle.log | tail -n 25 | tr '\n' ' ')
            echo "::error title=Gradle Build Error::$ERRORS"
            exit $BUILD_CODE
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-payment-router-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "**/app/build/outputs/apk/debug/*.apk"
          name: "Smart Payment Router ${{ github.ref_name }}"
          body: |
            ### Smart Payment Router Android APK Release
            - Native Jetpack Compose + CameraX + ML Kit Android Application
            - Real-time UPI QR Scanner, MCC-based Category Detection & Dynamic Card Reward Routing
            - Epic 2: Add/Edit/Delete Cards & Offers, Exclusions & 90-Day Rule Review
            - Download `app-debug.apk` below and install directly on your Android device!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
